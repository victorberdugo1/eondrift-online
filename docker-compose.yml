
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: ${PORT:-3000}
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tailscale:
    image: tailscale/tailscale:latest
    hostname: eondrift-online
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tailscale-state:
